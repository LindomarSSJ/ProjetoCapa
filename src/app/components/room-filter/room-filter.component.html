<div class="w-full mt-2 mb-8 block clear-both">
  <input
    type="text"
    [ngModel]="searchTerm()"
    (ngModelChange)="onSearchChange($event)"
    placeholder="Pesquisar por obra ou autor..."
    class="w-full p-3 text-sm font-bold uppercase tracking-wider text-black bg-white border-2 border-black shadow-md focus:outline-none focus:bg-gray-50 transition-all placeholder:text-gray-400 placeholder:normal-case"
  />
</div>
