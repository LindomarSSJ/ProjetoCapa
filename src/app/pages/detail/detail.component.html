<div class="max-w-4xl mx-auto p-6">
  <a routerLink="/explorar" class="text-sm font-bold text-gray-600 hover:text-gray-900 mb-6 inline-block transition-colors">
    ← Voltar ao Explorador
  </a>

  @if (loading()) {
    <p class="text-center py-8 text-gray-500 font-medium">Buscando detalhes do ambiente...</p>
  }

  @if (item(); as data) {
    <div class="bg-gray-100 border border-gray-300 rounded-lg p-6 grid grid-cols-1 md:grid-cols-2 gap-8 shadow-sm">
      <div class="bg-white p-4 rounded flex items-center justify-center border border-gray-200">
        <img [src]="data.image" [alt]="data.title" class="max-h-80 object-contain" />
      </div>
      <div class="flex flex-col justify-between">
        <div>
          <span class="text-xs uppercase tracking-widest text-yellow-600 font-bold">{{ data.category }}</span>
          <h1 class="text-2xl font-black text-gray-900 mt-2">{{ data.title }}</h1>
          <p class="text-gray-600 mt-4 leading-relaxed">{{ data.description }}</p>
        </div>
        <div class="mt-6 border-t border-gray-300 pt-4 flex items-center justify-between">
          <span class="text-3xl font-black text-gray-900">R$ {{ data.price.toFixed(2) }}</span>
          <button class="bg-yellow-500 hover:bg-yellow-600 font-bold text-slate-900 px-6 py-2 rounded transition-colors">
            Fixar no Espaço
          </button>
        </div>
      </div>
    </div>
  }
</div>
