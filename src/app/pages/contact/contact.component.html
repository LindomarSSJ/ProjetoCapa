<div class="sala2-container">
  <div class="sala2-header">
    <span class="tag">// FORMULÁRIO DE CURATORIA</span>
    <h1 class="title">ENTRE EM CONTATO</h1>
    <p class="subtitle">Envie observações, solicite reservas, mande criticas ou outros comentarios.</p>
  </div>

  <div class="sala2-card">
    <form class="sala2-form">
      <div class="form-group">
        <label for="name">NOME COMPLETO</label>
        <input type="text" id="name" placeholder="Ex: Maria Silva" />
      </div>

      <div class="form-group">
        <label for="email">E-MAIL DE CONTACTO</label>
        <input type="email" id="email" placeholder="Ex: maria@exemplo.com" />
      </div>

      <div class="form-group">
        <label for="observation">COMENTÁRIO</label>
        <textarea id="observation" rows="5" placeholder="Descreva as suas notas sobre o acervo..."></textarea>
      </div>

      <button type="submit" class="btn-submit">
        [ ENVIAR RELATÓRIO // REGISTAR ]
      </button>
    </form>
  </div>
</div>
